pr<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <title>Business Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Arial';
            background: linear-gradient(180deg, #1e3a8a 0%, #3b82f6 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }
        .container {
            width: 100%;
            max-width: 700px;
            text-align: center;
        }
        h1 {
            color: white;
            font-size: 48px;
            margin-bottom: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }
        .file-item {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            padding: 40px 30px;
            border-radius: 20px;
            text-decoration: none;
            color: white;
            display: flex;
            align-items: center;
            gap: 25px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            transition: 0.3s ease;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .file-item:hover {
            transform: translateY(-8px);
            background: rgba(255, 255, 255, 0.25);
            box-shadow: 0 15px 40px rgba(0,0,0,0.4);
        }
        .file-icon {
            font-size: 60px;
        }
        .file-info h3 {
            font-size: 28px;
            margin-bottom: 8px;
            text-align: left;
        }
        .file-info p {
            opacity: 0.8;
            font-size: 16px;
            text-align: left;
        }
        .back-btn {
            display: inline-block;
            margin-top: 40px;
            padding: 14px 30px;
            background: #ef4444;
            border-radius: 10px;
            text-decoration: none;
            color: white;
            font-weight: bold;
        }
    </style>
</head>

<style>
.contact-footer {

.contact-footer > p {
    color: white;

.social-icons {

}

.social-link {

.social-link img {
